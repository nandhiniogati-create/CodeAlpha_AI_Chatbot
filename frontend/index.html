<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
        }

        .status {
            margin-top: 12px;
            font-size: 14px;
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
        }

        .bot {
            background: #e2e8f0;
            margin-right: auto;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 15px 20px 5px;
        }

        .suggestion {
            border: 1px solid #2563eb;
            background: white;
            color: #2563eb;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #2563eb;
            color: white;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #ddd;
        }

        #messageInput {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        #sendButton {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🤖 CodeAlpha AI Chatbot</h1>
        <p>Welcome to CodeAlpha Support</p>
        <div class="status">🟢 Chatbot online</div>
    </div>

    <div id="chatBox" class="chat-box">
        <div class="message bot">
            Hello! 👋 Welcome to CodeAlpha Support. How can I help you today?
        </div>
    </div>

    <div class="suggestions">
        <button class="suggestion" data-message="What services do you offer?">
            Services
        </button>

        <button class="suggestion" data-message="What is your pricing?">
            Pricing
        </button>

        <button class="suggestion" data-message="Tell me about cloud computing">
            Cloud
        </button>

        <button class="suggestion" data-message="How can I contact support?">
            Support
        </button>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            maxlength="500"
        >

        <button id="sendButton">
            Send
        </button>
    </div>

    <div class="footer">
        CodeAlpha Cloud Computing Internship — Task 4
    </div>

</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const suggestionButtons = document.querySelectorAll(".suggestion");

    function addMessage(message, sender) {
        const messageElement = document.createElement("div");

        messageElement.className = `message ${sender}`;
        messageElement.textContent = message;

        chatBox.appendChild(messageElement);

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage(message) {
        const trimmedMessage = message.trim();

        if (!trimmedMessage) {
            return;
        }

        addMessage(trimmedMessage, "user");

        messageInput.value = "";
        sendButton.disabled = true;

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: trimmedMessage
                })
            });

            const data = await response.json();

            if (data.success) {
                addMessage(data.response, "bot");
            } else {
                addMessage(
                    data.message || "Something went wrong.",
                    "bot"
                );
            }

        } catch (error) {
            addMessage(
                "Unable to connect to the chatbot server.",
                "bot"
            );
        }

        sendButton.disabled = false;
        messageInput.focus();
    }

    sendButton.addEventListener("click", () => {
        sendMessage(messageInput.value);
    });

    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            sendMessage(messageInput.value);
        }
    });

    suggestionButtons.forEach((button) => {
        button.addEventListener("click", () => {
            sendMessage(button.dataset.message);
        });
    });
</script>

</body>
</html>
